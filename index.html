<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo de los GOTY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: #0E1024;
    --stage-2: #191C3B;
    --paper: #EDEFF7;
    --ink: #15172E;
    --ink-soft: #4A4D6E;
    --line: #C5C9DE;
    --red: #E5233D;
    --gold: #FFC53D;
    --focus: #8F93FF;
    --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html { color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 420px at 50% -140px, #2B2F66 0%, transparent 70%),
      var(--stage);
    color: var(--paper);
    font-family: var(--font-body);
    line-height: 1.4;
  }

  .page {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 16px 56px;
  }

  /* header */
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  h1 { margin: 0; line-height: 0; }
  .logo-wrap {
    position: relative;
    display: block;
    width: clamp(190px, 52vw, 340px);
  }
  .logo {
    display: block;
    width: 100%;
    height: auto;
    transition: opacity .25s;
  }
  .secret {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 40px;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 50%;
    background: #2FB35A;
    color: #fff;
    font: 800 1.3rem/1 var(--font-body);
    cursor: pointer;
    opacity: 0;
    transition: opacity .25s, background .15s;
  }
  .secret:hover { background: #3FCB6F; }
  .secret:active { background: #23964A; }
  .secret:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .logo-wrap:hover .logo, .logo-wrap:focus-within .logo { opacity: 0; }
  .logo-wrap:hover .secret, .logo-wrap:focus-within .secret { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .logo, .secret { transition: none; } }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin: 22px 0 18px;
  }

  /* grid width input */
  .width {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    color: #B9BDDB;
    font-size: .95rem;
    font-weight: 600;
  }
  .width input {
    width: 4.2rem;
    min-height: 44px;
    font: 600 1rem var(--font-body);
    text-align: center;
    padding: .4rem .3rem;
    border-radius: 8px;
    border: 1.5px solid #454A83;
    background: transparent;
    color: var(--paper);
  }
  .width input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* buttons */
  .btn {
    font: 600 1rem var(--font-body);
    min-height: 44px;
    padding: .6rem 1.1rem;
    border-radius: 8px;
    border: 1.5px solid transparent;
    cursor: pointer;
    color: inherit;
    background: none;
  }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .btn.primary { background: var(--gold); color: var(--ink); }
  .btn.primary:hover { background: #FFD266; }

  .btn.ghost { border-color: #454A83; color: var(--paper); }
  .btn.ghost:hover { background: #232754; }
  .btn.ghost[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }

  .btn.small { min-height: 40px; padding: .4rem .85rem; font-size: .92rem; white-space: nowrap; flex-shrink: 0; }

  .btn.solid { background: var(--ink); color: #fff; }
  .btn.solid:hover { background: #26294d; }
  .btn.outline { border-color: var(--ink-soft); color: var(--ink); }
  .btn.outline:hover { background: #dfe2f1; }
  .btn.danger { color: #B3122B; margin-right: auto; }
  .btn.danger:hover { background: #f6dde1; }

  /* grid */
  .grid {
    --fs: clamp(.62rem, 2.5vw, .98rem);
    display: grid;
    grid-template-columns: repeat(var(--n), minmax(0, 1fr));
    gap: clamp(4px, 1.2vw, 10px);
    width: 100%;
  }
  .grid[data-size="2"] { --fs: clamp(1.1rem, 6vw, 1.9rem); }
  .grid[data-size="3"] { --fs: clamp(.9rem, 4.4vw, 1.5rem); }
  .grid[data-size="4"] { --fs: clamp(.74rem, 3.2vw, 1.15rem); }
  .grid[data-size="6"], .grid[data-size="7"], .grid[data-size="8"] { --fs: clamp(.55rem, 1.9vw, .8rem); }
  .grid[data-size="9"], .grid[data-size="10"] { --fs: clamp(.5rem, 1.6vw, .7rem); }
  .grid[data-size="7"] .cell-main, .grid[data-size="8"] .cell-main,
  .grid[data-size="9"] .cell-main, .grid[data-size="10"] .cell-main { padding: 2px; }

  .grid.editing { outline: 2px dashed var(--gold); outline-offset: 6px; }

  .cell {
    position: relative;
    aspect-ratio: 1;
    border-radius: 6px;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--line);
  }

  .cell-main {
    all: unset;
    flex-direction: column;
    gap: .25em;
    box-sizing: border-box;
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(4px, 1.4vw, 12px);
    text-align: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: var(--fs);
    line-height: 1.15;
  }
  .cell-main:focus-visible { outline: 3px solid #5B5FFF; outline-offset: -3px; }

  .txt {
    display: block;
    max-width: 100%;
    overflow-wrap: anywhere;
    hyphens: auto;
  }

  .by {
    display: block;
    max-width: 100%;
    font-size: .74em;
    font-weight: 700;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell.empty {
    background: transparent;
    box-shadow: none;
    border: 1.5px dashed #3A3F78;
  }
  .cell.empty .cell-main { color: #8084AE; font-size: 1.6rem; font-weight: 400; }
  .grid[data-size="8"] .cell.empty .cell-main, .grid[data-size="9"] .cell.empty .cell-main, .grid[data-size="10"] .cell.empty .cell-main { font-size: 1rem; }
  .cell.empty:hover { background: #171A3A; }

  .cell.filled:hover { background: #fff; }

  .cell.crossed { background: #DADDEE; }
  .cell.crossed .txt { opacity: .55; }

  .x {
    position: absolute;
    inset: 8%;
    width: 84%;
    height: 84%;
    pointer-events: none;
    display: none;
    transform-origin: 50% 50%;
  }
  .cell.crossed .x { display: block; }
  .grid.editing .cell.crossed .x { opacity: .25; }

  .cell.stamp .x { animation: slam .38s cubic-bezier(.2, 1.5, .4, 1) both; }

  @keyframes slam {
    0%   { transform: scale(2.8) rotate(-16deg); opacity: 0; }
    60%  { opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* winning line */
  .cell.win {
    background: #FFF1C6;
    box-shadow: inset 0 0 0 3px var(--gold), 0 0 18px rgba(255, 197, 61, .55);
  }
  .cell.win .txt { opacity: .7; }

  .cell.pop { z-index: 2; animation: pop .7s var(--d, 0ms) both; }
  @keyframes pop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.16); background: var(--gold); }
    100% { transform: scale(1); }
  }

  /* below grid */
  .status { margin: 16px 0 10px; color: #B9BDDB; font-size: .95rem; min-height: 1.4em; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  /* dialog */
  dialog {
    border: 0;
    border-radius: 12px;
    padding: 0;
    width: min(92vw, 420px);
    background: var(--paper);
    color: var(--ink);
  }
  dialog::backdrop { background: rgba(6, 7, 20, .72); }
  .dlg-body { padding: 22px; }
  .dlg-body h2 { margin: 0 0 14px; font: 800 1.9rem/1 var(--font-display); }
  .dlg-body label { display: block; font-weight: 600; margin-bottom: 8px; }
  .dlg-body input {
    width: 100%;
    font: 500 1rem var(--font-body);
    padding: .75rem .8rem;
    border: 1.5px solid var(--ink-soft);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  .dlg-body input:focus-visible { outline: 3px solid #5B5FFF; outline-offset: 1px; }
  .dlg-body input + .lbl, .lbl { margin-top: 14px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; border: 0; padding: 0; margin: 0; }
  .swatches legend { padding: 0; font-weight: 600; margin-bottom: 8px; }
  .sw { position: relative; }
  .sw input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; cursor: pointer; }
  .sw span {
    display: block;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55);
  }
  .sw input:checked + span { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--c); }
  .sw input:focus-visible + span { outline: 3px solid #5B5FFF; outline-offset: 4px; }
  .sw input:disabled { cursor: not-allowed; }
  .sw input:disabled + span { opacity: .22; background-image: linear-gradient(45deg, transparent 45%, #fff 45% 55%, transparent 55%); }
  .hint { color: var(--ink-soft); font-size: .86rem; margin: 6px 0 0; }
  .dlg-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

  /* toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 20px);
    background: var(--paper);
    color: var(--ink);
    padding: .7rem 1rem;
    border-radius: 8px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 30;
    max-width: 92vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* win banner and confetti */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 19; }

  .banner {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    z-index: 20;
  }
  .plate {
    background: var(--gold);
    color: var(--ink);
    padding: .1em .45em .05em;
    border-radius: 10px;
    text-align: center;
    opacity: 0;
    box-shadow: 0 18px 60px rgba(0, 0, 0, .5);
  }
  .plate b {
    display: block;
    font: 900 clamp(3.6rem, 17vw, 9rem)/1 var(--font-display);
  }
  .plate span:empty { display: none; }
  .plate:has(span:empty) { padding-bottom: .12em; }
  .plate span {
    display: block;
    font: 600 1.05rem var(--font-body);
    padding-bottom: .7rem;
  }
  .banner.show .plate { animation: plateIn 3.4s both; }

  @keyframes plateIn {
    0%   { opacity: 0; transform: scale(.55) rotate(-9deg); }
    8%   { opacity: 1; transform: scale(1.1) rotate(-3deg); }
    14%  { transform: scale(1) rotate(-3deg); }
    86%  { opacity: 1; transform: scale(1) rotate(-3deg); }
    100% { opacity: 0; transform: scale(1.06) rotate(-3deg); }
  }
  @keyframes plateFade {
    0% { opacity: 0; } 10% { opacity: 1; } 86% { opacity: 1; } 100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cell.stamp .x, .cell.pop { animation: none; }
    .banner.show .plate { animation-name: plateFade; }
    .toast { transition: none; }
  }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="page">
  <div class="top">
    <h1 class="logo-wrap">
      <img class="logo" src="logo.png" alt="The Game Awards: Bingo" width="1780" height="606">
      <button class="secret" id="secret" type="button" aria-label="Reproducir sonido secreto">?</button>
    </h1>
    <button class="btn ghost small" id="sound" type="button" aria-pressed="true">Sonido activado</button>
  </div>

  <div class="actions">
    <button class="btn primary" id="add" type="button">Agregar predicción</button>
    <button class="btn ghost" id="edit" type="button" aria-pressed="false">Editar casillas</button>
    <label class="width">Ancho
      <input id="width" type="number" inputmode="numeric" min="2" max="10" step="1" aria-label="Ancho de la grilla (casillas por fila)">
    </label>
  </div>

  <div class="grid" id="grid" aria-label="Bingo card"></div>

  <p class="status" id="status" role="status"></p>

  <div class="controls">
    <button class="btn ghost small" id="clear" type="button">Borrar cruces</button>
    <button class="btn ghost small" id="reset" type="button">Reiniciar cartón</button>
  </div>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="form" class="dlg-body" autocomplete="off">
    <h2 id="dlg-title">Nueva predicción</h2>
    <label for="who">Tu nombre</label>
    <input id="who" type="text" maxlength="20" list="names" placeholder="Ej: Sofi" required>
    <datalist id="names"></datalist>

    <label class="lbl" for="field">¿Qué va a pasar?</label>
    <input id="field" type="text" maxlength="80" placeholder="El discurso del ganador se pasa de tiempo" required>
    <p class="hint">Que sea corta: 80 caracteres como máximo.</p>

    <fieldset class="swatches lbl" id="swatches">
      <legend>Tu color</legend>
    </fieldset>
    <p class="hint" id="color-hint" role="status"></p>
    <div class="dlg-actions">
      <button class="btn danger" id="delete" type="button">Eliminar</button>
      <button class="btn outline" id="cancel" type="button">Cancelar</button>
      <button class="btn solid" type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<div class="banner" id="banner" aria-live="polite">
  <div class="plate"><b id="banner-title">¡BINGO!</b><span id="banner-sub"></span></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  const KEY = 'goty-bingo-v1';
  const MIN = 2, MAX = 10;
  const SOUND_KEY = 'goty-bingo-sound';
  const $ = (s) => document.querySelector(s);

  const grid = $('#grid'), statusEl = $('#status'), dlg = $('#dlg'), field = $('#field');
  const widthInput = $('#width');
  const who = $('#who'), swatchBox = $('#swatches'), colorHint = $('#color-hint'), namesList = $('#names');
  const PALETTE = [
    ['#D7263D', 'Rojo'], ['#E8590C', 'Naranja'], ['#B7791F', 'Ámbar'], ['#5C940D', 'Lima'],
    ['#2B8A3E', 'Verde'], ['#0B7285', 'Turquesa'], ['#1971C2', 'Azul'], ['#4263EB', 'Índigo'],
    ['#7048E8', 'Violeta'], ['#C2255C', 'Magenta'], ['#7F5539', 'Marrón'], ['#495057', 'Gris']
  ];
  const norm = (n) => n.trim().replace(/\s+/g, ' ').toLowerCase();
  const form = $('#form'), toastEl = $('#toast'), banner = $('#banner'), bannerSub = $('#banner-sub');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const bond = new Audio('bond.mp3');
  bond.preload = 'auto';
  const wololo = new Audio('wololo.mp3');
  wololo.preload = 'auto';
  const audio = new Audio('1.mp3');
  audio.preload = 'auto';

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
  };

  let soundOn = store.get(SOUND_KEY) !== 'off';
  let editMode = false;
  let editing = -1;
  let openedFrom = 'add';

  /* ---------- state ---------- */
  const fresh = (n) => ({ size: n, cells: Array.from({ length: n * n }, () => ({ text: '', crossed: false, by: null })) });

  function load() {
    try {
      const s = JSON.parse(store.get(KEY));
      if (s && Number.isInteger(s.size) && s.size >= MIN && s.size <= MAX && Array.isArray(s.cells) && s.cells.length === s.size * s.size) {
        s.cells = s.cells.map((c) => {
          const text = String((c && c.text) || '').slice(0, 80);
          const by = c && c.by && typeof c.by.name === 'string' && PALETTE.some((p) => p[0] === c.by.color)
            ? { name: c.by.name.slice(0, 20), color: c.by.color } : null;
          return { text, crossed: !!(c && c.crossed && text), by: text ? by : null };
        });
        return s;
      }
    } catch (e) { /* fall through */ }
    return fresh(5);
  }

  let state = load();
  const save = () => store.set(KEY, JSON.stringify(state));

  /* ---------- lines ---------- */
  function allLines(n) {
    const lines = [];
    for (let r = 0; r < n; r++) lines.push(Array.from({ length: n }, (_, c) => r * n + c));
    for (let c = 0; c < n; c++) lines.push(Array.from({ length: n }, (_, r) => r * n + c));
    lines.push(Array.from({ length: n }, (_, i) => i * n + i));
    lines.push(Array.from({ length: n }, (_, i) => i * n + (n - 1 - i)));
    return lines;
  }
  const completeLines = () =>
    allLines(state.size).filter((l) => l.every((i) => state.cells[i].text && state.cells[i].crossed));
  const key = (l) => l.join('-');

  let done = new Set(completeLines().map(key));
  const syncDone = () => { done = new Set(completeLines().map(key)); };

  function lineName(l) {
    const n = state.size, d = l[1] - l[0];
    if (d === 1) return 'Fila ' + (Math.floor(l[0] / n) + 1);
    if (d === n) return 'Columna ' + (l[0] + 1);
    return 'Diagonal';
  }

  /* ---------- render ---------- */
  const X_SVG =
    '<svg class="x" viewBox="0 0 100 100" aria-hidden="true">' +
    '<path d="M16 19 L84 83" stroke="#E5233D" stroke-width="11" stroke-linecap="round" fill="none"/>' +
    '<path d="M84 17 L17 84" stroke="#E5233D" stroke-width="11" stroke-linecap="round" fill="none"/>' +
    '</svg>';

  function render(opts = {}) {
    const { stamp = -1, focus = -1, newLines = [] } = opts;
    const win = new Set(completeLines().flat());

    const popDelay = new Map();
    newLines.forEach((line) => line.forEach((idx, pos) => {
      const d = pos * 90;
      if (!popDelay.has(idx) || popDelay.get(idx) > d) popDelay.set(idx, d);
    }));

    grid.style.setProperty('--n', state.size);
    grid.dataset.size = state.size;
    grid.classList.toggle('editing', editMode);
    grid.textContent = '';

    state.cells.forEach((c, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell ' + (c.text ? 'filled' : 'empty');
      if (c.crossed) cell.classList.add('crossed');
      if (win.has(i)) cell.classList.add('win');
      if (i === stamp) cell.classList.add('stamp');
      if (popDelay.has(i) && !reduceMotion) {
        cell.classList.add('pop');
        cell.style.setProperty('--d', popDelay.get(i) + 'ms');
      }

      const main = document.createElement('button');
      main.type = 'button';
      main.className = 'cell-main';

      if (c.text) {
        const t = document.createElement('span');
        t.className = 'txt';
        t.textContent = c.text;
        main.appendChild(t);
        if (c.by) {
          const b = document.createElement('span');
          b.className = 'by';
          b.textContent = c.by.name;
          b.style.color = c.by.color;
          main.appendChild(b);
        }
        if (!editMode) main.setAttribute('aria-pressed', String(c.crossed));
        main.setAttribute('aria-label', c.text + (c.by ? ', de ' + c.by.name : '') + (editMode ? ', editar' : c.crossed ? ', tachada' : ', pendiente'));
        main.addEventListener('click', () => (editMode ? openDialog(i, 'cell') : toggle(i)));
        cell.appendChild(main);
        cell.insertAdjacentHTML('beforeend', X_SVG);
      } else {
        main.textContent = '+';
        main.setAttribute('aria-label', 'Agregar una predicción a la casilla ' + (i + 1));
        main.addEventListener('click', () => openDialog(i, 'cell'));
        cell.appendChild(main);
      }
      grid.appendChild(cell);
    });

    const filled = state.cells.filter((c) => c.text).length;
    const crossed = state.cells.filter((c) => c.crossed).length;
    statusEl.textContent = editMode
      ? 'Tocá una casilla para cambiarla o eliminarla.'
      : filled + ' de ' + state.cells.length + ' casillas completas, ' + crossed + ' tachadas';

    if (document.activeElement !== widthInput) widthInput.value = state.size;
    $('#edit').setAttribute('aria-pressed', String(editMode));

    requestAnimationFrame(fit);
    if (focus >= 0) {
      const el = grid.children[focus] && grid.children[focus].querySelector('.cell-main');
      if (el) el.focus();
    }
  }

  /* shrink long text until it fits its square */
  function fit() {
    grid.querySelectorAll('.cell-main .txt').forEach((span) => {
      const main = span.parentElement;
      span.style.fontSize = '';
      const cs = getComputedStyle(main);
      const by = main.querySelector('.by');
      const extra = by ? by.offsetHeight + parseFloat(cs.rowGap || 0) : 0;
      const avail = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - extra;
      let size = parseFloat(getComputedStyle(span).fontSize);
      let guard = 0;
      while (span.offsetHeight > avail && size > 7 && guard++ < 40) {
        size -= 0.5;
        span.style.fontSize = size + 'px';
      }
    });
  }
  addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* ---------- actions ---------- */
  function toggle(i) {
    const c = state.cells[i];
    c.crossed = !c.crossed;
    save();
    const now = completeLines();
    const newLines = now.filter((l) => !done.has(key(l)));
    done = new Set(now.map(key));
    render({ stamp: c.crossed ? i : -1, focus: i, newLines });
    if (newLines.length) celebrate(newLines);
    else if (c.crossed && touchesCrossed(i)) combo();
  }

  /* any crossed square next to this one, sides or corners */
  function touchesCrossed(i) {
    const n = state.size, r = Math.floor(i / n), col = i % n;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const rr = r + dr, cc = col + dc;
        if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
        if (state.cells[rr * n + cc].crossed) return true;
      }
    }
    return false;
  }

  function combo() {
    if (soundOn) {
      try { bond.pause(); bond.currentTime = 0; bond.play().catch(() => {}); } catch (e) { /* ignore */ }
    }
    showBanner('¡COMBO!', '');
  }

  function openDialog(i, from) {
    editing = i;
    openedFrom = from;
    const c = state.cells[i];
    $('#dlg-title').textContent = c.text ? 'Editar predicción' : 'Nueva predicción';
    field.value = c.text;
    who.value = c.by ? c.by.name : lastWho;
    $('#delete').hidden = !c.text;
    namesList.textContent = '';
    people(-1).forEach((col, key) => {
      const o = document.createElement('option');
      o.value = col.name;
      namesList.appendChild(o);
    });
    buildSwatches(c.by ? c.by.color : '');
    dlg.showModal();
    (who.value ? field : who).focus();
    (who.value ? field : who).select();
  }

  /* people = name -> {name, color}, ignoring the square being edited */
  function people(skip) {
    const m = new Map();
    state.cells.forEach((c, i) => { if (i !== skip && c.text && c.by) m.set(norm(c.by.name), c.by); });
    return m;
  }

  function buildSwatches(selected) {
    swatchBox.querySelectorAll('.sw').forEach((n) => n.remove());
    PALETTE.forEach(([hex, label]) => {
      const l = document.createElement('label');
      l.className = 'sw';
      l.innerHTML = '<input type="radio" name="color" value="' + hex + '" aria-label="' + label + '"><span></span>';
      l.querySelector('span').style.setProperty('--c', hex);
      if (hex === selected) l.querySelector('input').checked = true;
      swatchBox.appendChild(l);
    });
    updateSwatches();
  }

  /* lock colors: a known name keeps its own color; a new name can't take a used one */
  function updateSwatches() {
    const ppl = people(editing);
    const mine = ppl.get(norm(who.value));
    const used = new Set([...ppl.values()].map((p) => p.color));
    const inputs = [...swatchBox.querySelectorAll('input')];
    inputs.forEach((i) => {
      i.disabled = mine ? i.value !== mine.color : used.has(i.value);
      if (mine && i.value === mine.color) i.checked = true;
      else if (i.disabled) i.checked = false;
    });
    colorHint.textContent = mine ? 'Este nombre ya tiene su color.'
      : inputs.every((i) => i.disabled) ? 'No quedan colores libres.'
      : 'Los colores tachados ya los usa otra persona.';
  }
  who.addEventListener('input', updateSwatches);
  let lastWho = '';

  function commit(value, by) {
    const i = editing;
    const c = state.cells[i];
    c.text = value;
    c.by = value ? by : null;
    if (!value) c.crossed = false;
    if (by) lastWho = by.name;
    save();
    syncDone();
    dlg.close();
    render({ focus: openedFrom === 'cell' ? i : -1 });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = who.value.trim().replace(/\s+/g, ' ');
    const picked = swatchBox.querySelector('input:checked');
    if (!name) { who.focus(); return; }
    if (!picked) { colorHint.textContent = 'Elegí un color para continuar.'; swatchBox.querySelector('input:not(:disabled)')?.focus(); return; }
    const known = people(editing).get(norm(name));
    commit(field.value.trim().replace(/\s+/g, ' '), { name: known ? known.name : name, color: picked.value });
  });
  $('#cancel').addEventListener('click', () => dlg.close());
  $('#delete').addEventListener('click', () => commit('', null));
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

  $('#add').addEventListener('click', () => {
    const i = state.cells.findIndex((c) => !c.text);
    if (i < 0) { showToast('El cartón está lleno. Eliminá una casilla o agrandá la grilla.'); return; }
    openDialog(i, 'add');
  });

  $('#edit').addEventListener('click', () => { editMode = !editMode; render(); });

  /* grid width: applies when the field is committed (change/Enter/blur) */
  widthInput.addEventListener('change', () => {
    const v = Math.round(Number(widthInput.value));
    if (!Number.isFinite(v) || widthInput.value === '') { widthInput.value = state.size; return; }
    const n = Math.min(MAX, Math.max(MIN, v));
    widthInput.value = n;
    resize(n);
  });
  widthInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') widthInput.blur(); });

  function resize(n) {
    if (n === state.size) return;
    const filled = state.cells.filter((c) => c.text);
    if (filled.length > n * n &&
        !confirm('Una grilla de ' + n + '×' + n + ' solo entra ' + n * n + ' predicciones. Se van a eliminar las últimas ' +
                 (filled.length - n * n) + '. ¿Continuar?')) {
      widthInput.value = state.size;
      return;
    }
    const next = fresh(n);
    filled.slice(0, n * n).forEach((c, i) => { next.cells[i] = { text: c.text, crossed: c.crossed, by: c.by }; });
    state = next;
    save();
    syncDone();
    render();
  }

  $('#clear').addEventListener('click', () => {
    if (!state.cells.some((c) => c.crossed)) return;
    if (!confirm('¿Quitar todas las cruces? Tus predicciones se mantienen.')) return;
    state.cells.forEach((c) => { c.crossed = false; });
    save();
    syncDone();
    render();
  });

  $('#reset').addEventListener('click', () => {
    if (!confirm('¿Borrar todas las predicciones y empezar un cartón vacío?')) return;
    state = fresh(state.size);
    save();
    syncDone();
    render();
  });

  $('#secret').addEventListener('click', () => {
    try { wololo.currentTime = 0; wololo.play().catch(() => {}); } catch (e) { /* ignore */ }
  });

  const soundBtn = $('#sound');
  function paintSound() {
    soundBtn.textContent = soundOn ? 'Sonido activado' : 'Sonido apagado';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    store.set(SOUND_KEY, soundOn ? 'on' : 'off');
    if (!soundOn) audio.pause();
    paintSound();
  });
  paintSound();

  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  /* ---------- celebration ---------- */
  let bannerTimer;
  function celebrate(lines) {
    if (soundOn) {
      try { audio.pause(); audio.currentTime = 0; audio.play().catch(() => {}); } catch (e) { /* ignore */ }
    }
    showBanner('¡BINGO!', lines.length > 1 ? lines.length + ' líneas a la vez' : lineName(lines[0]));
    if (!reduceMotion) confetti();
  }

  function showBanner(title, sub) {
    $('#banner-title').textContent = title;
    bannerSub.textContent = sub;
    banner.classList.remove('show');
    void banner.offsetWidth;
    banner.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => banner.classList.remove('show'), 3400);
  }

  const cv = $('#fx');
  let raf = 0;
  function confetti() {
    cancelAnimationFrame(raf);
    const ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = innerWidth, H = innerHeight;
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colors = ['#FFC53D', '#E5233D', '#EDEFF7', '#8F93FF', '#FF8A5B'];
    const parts = Array.from({ length: 170 }, () => ({
      x: W / 2 + (Math.random() - 0.5) * 220,
      y: H * 0.55,
      vx: (Math.random() - 0.5) * 18,
      vy: -Math.random() * 17 - 6,
      g: 0.3 + Math.random() * 0.12,
      w: 6 + Math.random() * 7,
      h: 4 + Math.random() * 5,
      r: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 0.4,
      c: colors[(Math.random() * colors.length) | 0]
    }));

    const t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, W, H);
      let alive = false;
      for (const p of parts) {
        p.vy += p.g;
        p.vx *= 0.992;
        p.x += p.vx;
        p.y += p.vy;
        p.r += p.vr;
        if (p.y < H + 30) alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (alive && t - t0 < 5000) raf = requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, W, H);
    })(t0);
  }

  render();
})();
</script>
</body>
</html>
